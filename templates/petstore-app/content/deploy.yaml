kind: Deployment
apiVersion: apps/v1
metadata:
  name: my-petstore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: petstore-app
  template:
    metadata:
      labels:
        app: petstore-app
    spec:
      containers:
        - name: my-petstore
          image: petstore-image:latest
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              memory: "50Mi"
              cpu: "10m"
          env:
            - name: DATABASE_URL
              value: "postgresql+asyncpg://postgres:postgres@db:5432/petstore"
---
kind: Service
apiVersion: v1
metadata:
  name: my-petstore
spec:
  ports:
    - name: http-8000
      port: 8000
      protocol: TCP
      targetPort: 8000
  selector:
    app: petstore-app
